name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install runtime + dev requirements together so the test environment
          # matches what contributors use locally.
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Verify formatting (black)
        run: python -m black --check .

      - name: Verify import order (isort)
        run: python -m isort --check-only --profile black .

      - name: Lint (flake8)
        run: python -m flake8 app tests

      - name: Run tests with coverage gate
        run: |
          pytest \
            --cov=app.core \
            --cov=app.database \
            --cov=app.services \
            --cov=app.notifications \
            --cov-fail-under=70 \
            --cov-report=term-missing
